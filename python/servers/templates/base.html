<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hue Mix Link{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="sticky top-0 z-40 shadow-sm bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Hue Mix Link Logo" class="h-10 w-10">
                    <div>
                        <a href="/" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">
                            Hue Mix Link
                        </a>
                        <p class="text-xs text-gray-600">ESP-NOW Button Control</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="showSettingsModal()" class="px-3 py-2 text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors inline-flex items-center">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </button>
                    <!-- {% for service in services %}
                        <div class="px-3 py-1 rounded-full flex items-center space-x-2
                            {% if service.status == 'online' %} bg-green-50 border border-green-200 text-green-700
                            {% elif service.status == 'starting' %} bg-yellow-50 border border-yellow-200 text-yellow-700
                            {% elif service.status in ['offline','error'] %} bg-red-50 border border-red-200 text-red-700
                            {% else %} bg-gray-50 border border-gray-200 text-gray-700 {% endif %}"
                            title="{{ service.name }}: {{ service.status|capitalize }}">
                            <div class="w-2 h-2 rounded-full
                                {% if service.status == 'online' %} bg-green-500 animate-pulse
                                {% elif service.status == 'starting' %} bg-yellow-500 animate-pulse
                                {% elif service.status in ['offline','error'] %} bg-red-500
                                {% else %} bg-gray-400 {% endif %}"></div>
                            <span class="text-xs font-medium">{{ service.name }}</span>
                            <span class="text-xs opacity-80">· {{ service.status|capitalize }}</span>
                        </div>
                    {% endfor %} -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4">
            <!-- Background overlay -->
            <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" onclick="closeSettingsModal()"></div>
            
            <!-- Modal panel -->
            <div class="relative inline-block bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:max-w-lg sm:w-full z-10">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="flex items-center mb-4">
                        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                            <i class="fas fa-cog text-blue-600"></i>
                        </div>
                        <div class="ml-4">
                            <h3 class="text-lg leading-6 font-medium text-gray-900">
                                Application Settings
                            </h3>
                        </div>
                    </div>
                    
                    <div class="mt-4 space-y-4">
                        <!-- TCP Port Setting -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">TCP Server Port</label>
                            <input type="number" id="tcp-port-input" min="1" max="65535" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p class="text-xs text-gray-500 mt-1">Port for ESP32 button servers to connect (default: 5555)</p>
                        </div>
                        
                        <!-- Web Port Setting -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Web Server Port</label>
                            <input type="number" id="web-port-input" min="1" max="65535" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p class="text-xs text-gray-500 mt-1">Port for web interface (default: 5001)</p>
                        </div>
                        
                        <!-- Status Message -->
                        <div id="settings-status" class="hidden">
                            <!-- Status messages will appear here -->
                        </div>
                    </div>
                </div>
                
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="saveAndRestartSettings()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Save & Restart Servers
                    </button>
                    <button type="button" onclick="closeSettingsModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    function showSettingsModal() {
        // Load current settings
        fetch('/api/config')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('tcp-port-input').value = data.config.tcp_port || 5555;
                    document.getElementById('web-port-input').value = data.config.web_port || 5001;
                }
            })
            .catch(err => {
                console.error('Error loading settings:', err);
            });
        
        document.getElementById('settings-modal').classList.remove('hidden');
    }

    function closeSettingsModal() {
        document.getElementById('settings-modal').classList.add('hidden');
        document.getElementById('settings-status').classList.add('hidden');
    }

    function showSettingsStatus(message, type = 'info') {
        const statusEl = document.getElementById('settings-status');
        let bgColor = 'bg-blue-50 border-blue-200';
        let textColor = 'text-blue-800';
        let icon = 'fa-info-circle text-blue-600';
        
        if (type === 'success') {
            bgColor = 'bg-green-50 border-green-200';
            textColor = 'text-green-800';
            icon = 'fa-check-circle text-green-600';
        } else if (type === 'error') {
            bgColor = 'bg-red-50 border-red-200';
            textColor = 'text-red-800';
            icon = 'fa-exclamation-circle text-red-600';
        } else if (type === 'warning') {
            bgColor = 'bg-yellow-50 border-yellow-200';
            textColor = 'text-yellow-800';
            icon = 'fa-exclamation-triangle text-yellow-600';
        }
        
        statusEl.className = `${bgColor} border rounded-lg p-3`;
        statusEl.innerHTML = `
            <div class="flex">
                <i class="fas ${icon} mt-0.5"></i>
                <p class="ml-3 text-sm ${textColor}">${message}</p>
            </div>
        `;
        statusEl.classList.remove('hidden');
    }

    function saveAndRestartSettings() {
        const tcpPort = parseInt(document.getElementById('tcp-port-input').value);
        const webPort = parseInt(document.getElementById('web-port-input').value);
        
        if (isNaN(tcpPort) || tcpPort < 1 || tcpPort > 65535) {
            showSettingsStatus('TCP port must be between 1 and 65535', 'error');
            return;
        }
        
        if (isNaN(webPort) || webPort < 1 || webPort > 65535) {
            showSettingsStatus('Web port must be between 1 and 65535', 'error');
            return;
        }
        
        showSettingsStatus('Saving settings and restarting servers...', 'info');
        
        fetch('/api/config/restart', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                tcp_port: tcpPort,
                web_port: webPort
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showSettingsStatus(data.message, 'success');
                setTimeout(() => {
                    closeSettingsModal();
                    // Reload page after a short delay
                    window.location.reload();
                }, 2000);
            } else {
                showSettingsStatus('Error: ' + data.error, 'error');
            }
        })
        .catch(err => {
            console.error('Error saving settings:', err);
            showSettingsStatus('Error saving settings', 'error');
        });
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
