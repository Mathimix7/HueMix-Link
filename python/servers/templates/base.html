<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HueMix-Link{% endblock %}</title>
    <script src="{{ url_for('static', filename='tailwind.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/ui.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="sticky top-0 z-40 shadow-sm bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="HueMix-Link Logo" class="h-10 w-10">
                    <div>
                        <a href="/" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-blue-500 bg-clip-text text-transparent">
                            HueMix-Link
                        </a>
                        <p class="text-xs text-gray-600">ESP-NOW Button Control</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <a href="/admin/plugins" class="px-3 py-2 text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors inline-flex items-center">
                        <i class="fas fa-puzzle-piece mr-2"></i>Plugins
                    </a>
                    <a href="/admin/settings" class="px-3 py-2 text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors inline-flex items-center">
                        <i class="fas fa-cog mr-2"></i>Settings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/shared/toast.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
