{% extends "base.html" %}

{% block title %}Network Mesh - HueMix-Link{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/mesh.css') }}">
{% endblock %}

{% block content %}


<!-- Toast Notification -->
<div id="toast-notification" class="hidden fixed top-4 right-4 z-50 max-w-md">
    <div id="toast-container" class="rounded-lg shadow-2xl border-l-4 border-green-500 p-4 flex items-start space-x-3 transform transition-all duration-300 ease-out bg-green-50 translate-x-full opacity-0">
        <div class="flex-shrink-0">
            <i id="toast-icon" class="fas fa-check-circle text-2xl text-green-600"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p id="toast-title" class="text-sm font-semibold text-gray-900"></p>
            <p id="toast-message" class="text-sm text-gray-700 mt-1"></p>
        </div>
        <button onclick="hideToast()" class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-4xl pb-1 font-bold bg-gradient-to-r from-cyan-600 to-cyan-400 bg-clip-text text-transparent mb-1">
                    Network Mesh
                </h1>
                <p class="text-gray-600">Gateway routing and device connectivity overview</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="optimizeAllLights()" id="optimize-btn" class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 transition-all inline-flex items-center shadow-md hover:shadow-lg">
                    <i class="fas fa-network-wired mr-2"></i>Optimize All Lights
                </button>
                <button onclick="refreshMesh()" class="px-4 py-2 bg-cyan-600 text-white rounded-lg hover:bg-cyan-700 transition-colors inline-flex items-center">
                    <i id="refresh-icon" class="fas fa-sync-alt mr-2 transition-transform duration-500"></i>Refresh
                </button>
                <a href="/" class="px-4 py-2 bg-zinc-500 text-white rounded-lg hover:bg-zinc-600 transition-colors inline-flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i>Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Gateways List -->
    <div id="gateways-container" class="space-y-6">
        <!-- Gateways will be loaded here -->
    </div>
</div>

<script src="{{ url_for('static', filename='js/pages/mesh.js') }}"></script>
{% endblock %}
