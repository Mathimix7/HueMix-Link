{% extends 'base.html' %}

{% block title %}Rooms Overview - Hue Mix Link{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <!-- Page Header -->
    <div class="mb-8 text-center">
        <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-700 via-blue-500 to-blue-700 bg-clip-text text-transparent mb-2">
            🏠 Rooms Overview
        </h1>
        <p class="text-gray-600">All your smart home rooms at a glance</p>
    </div>

    <!-- Rooms Container -->
    <div id="rooms-container" class="space-y-3">
        <div class="text-center text-gray-500 py-8">
            <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
            <p>Loading rooms...</p>
        </div>
    </div>
</div>

<script>
    let scrollPosition = 0;
    
    async function loadRoomsData() {
        try {
            const response = await fetch('/api/rooms-overview/data');
            const data = await response.json();
            
            if (data.success) {
                const container = document.getElementById('rooms-container');
                
                if (data.rooms.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">No rooms found</div>';
                    return;
                }
                
                container.innerHTML = '';
                
                data.rooms.forEach(room => {
                    // Create room card
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl p-4 shadow-lg border-2 border-gray-100 hover:shadow-xl hover:border-blue-200 transition-all duration-300 flex items-center gap-4';
                    
                    // Room name
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'font-semibold text-gray-900 text-lg min-w-[180px] flex-shrink-0';
                    nameDiv.textContent = room.name;
                    card.appendChild(nameDiv);
                    
                    // Colors container
                    const colorsDiv = document.createElement('div');
                    colorsDiv.className = 'flex gap-2 flex-1 flex-wrap';
                    
                    if (room.colors && room.colors.length > 0) {
                        room.colors.forEach(color => {
                            const dot = document.createElement('div');
                            dot.className = 'w-7 h-7 rounded-lg border-2 border-white shadow-md hover:scale-110 transition-transform';
                            dot.style.backgroundColor = color;
                            colorsDiv.appendChild(dot);
                        });
                    }
                    
                    card.appendChild(colorsDiv);
                    
                    // Scene badge
                    const sceneDiv = document.createElement('div');
                    sceneDiv.className = 'px-4 py-2 bg-gradient-to-r from-gray-50 to-gray-100 rounded-lg text-sm text-gray-600 font-medium min-w-[140px] text-right flex-shrink-0 border border-gray-200';
                    
                    if (room.current_scene || room.current_scene_id) {
                        sceneDiv.textContent = room.current_scene || room.current_scene_id;
                    } else {
                        sceneDiv.textContent = '—';
                        sceneDiv.className = 'px-4 py-2 bg-gray-50 rounded-lg text-sm text-gray-400 font-medium min-w-[140px] text-right flex-shrink-0 border border-gray-100';
                    }
                    
                    card.appendChild(sceneDiv);
                    
                    container.appendChild(card);
                });
            } else {
                const container = document.getElementById('rooms-container');
                container.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-center">Error: ' + (data.error || 'Unknown error') + '</div>';
            }
        } catch (error) {
            console.error('Error loading rooms:', error);
            const container = document.getElementById('rooms-container');
            container.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-center">Failed to load rooms data</div>';
        }
    }

    // Save scroll position before refresh
    function saveScrollPosition() {
        scrollPosition = window.scrollY;
    }

    // Restore scroll position after refresh
    function restoreScrollPosition() {
        window.scrollTo(0, scrollPosition);
    }

    // Initial load
    loadRoomsData();

    // Auto-refresh every 5 seconds
    setInterval(() => {
        saveScrollPosition();
        loadRoomsData().then(restoreScrollPosition);
    }, 5000);
</script>
{% endblock %}
